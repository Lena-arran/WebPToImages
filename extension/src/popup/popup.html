<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Converter</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="popup">
        <header class="popup-header">
            <div class="top_icon">
                <img src="/icons/converter-icon_128.png" alt="">
            </div>
            <div class="top_text">
                <h1>Image to JPG/PNG Converter</h1>
                <p>あらゆる画像をJPG/PNGに変換します💡</p>
            </div>
        </header>
        <section class="filename-section">
            <h2>ダウンロードファイル名</h2>
            <input type="text" id="filename" value="image-converted" class="text-input">
            <p>ファイル名を固定設定したい際にご利用ください</p>
        </section>
        <section class="quality-section">
            <div class="quality_top">
                <h2>JPG画質（圧縮率）</h2>
                <span class="badge">JPGのみ</span>
            </div>
            <div class="quality-control">
                <input type="range" class="range-control" min="0" max="100" value="100" id="qualityRange">
                <span class="" id="qualityValue">90%</span>
            </div>
            <p>数値が高いほど高画質になります<br>（ファイルサイズも大きくなります）</p>
        </section>
        <button class="save-btn" id="save">設定を保存</button>
        <section class="state-section">
            <div class="state-box" id="statusMessage">ステータス表示</div>
        </section>
    </main>
<script src="popup.js"></script>
</body>
</html>
